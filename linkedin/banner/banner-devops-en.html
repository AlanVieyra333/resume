<!doctype html>
<!--
  LinkedIn banner - DevOps profile (EN).

  Canvas: 1584 x 396 px (the size LinkedIn recommends). Rendered at 2x with
  --force-device-scale-factor=2, the exported PNG is 3168 x 792 px.

  Palette is taken from the CV itself so the banner and the PDFs read as one
  package: #1A3A5C is `headingcolor` in style.cls, #C9C9C9 is `designbandtext`
  in styles/styledesign.tex, and #38BDF8 is the single accent added on top.

  Regenerate with:  make banner   (see README.md in this folder)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn banner - DevOps (EN)</title>
<style>
  :root{
    --navy-900:#08182B;
    --navy-800:#0F2740;
    --navy-700:#1A3A5C;   /* headingcolor (style.cls) */
    --navy-600:#24517E;
    --accent:#38BDF8;
    --accent-soft:#7DD3FC;
    --ink:#FFFFFF;
    --ink-2:#A9C0D8;
    --ink-3:#9DB4CC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#08182B}
  body{
    width:1584px;height:396px;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
    color:var(--ink);
  }
  .banner{
    position:relative;width:1584px;height:396px;overflow:hidden;
    background:
      radial-gradient(1100px 430px at 74% -18%, rgba(56,189,248,.26), rgba(56,189,248,0) 62%),
      radial-gradient(560px 460px at 15% 52%, rgba(255,255,255,.10), rgba(255,255,255,0) 68%),
      radial-gradient(760px 460px at 2% 116%, rgba(36,81,126,.62), rgba(36,81,126,0) 66%),
      linear-gradient(108deg, var(--navy-900) 0%, var(--navy-800) 46%, var(--navy-700) 78%, #1E4470 100%);
  }
  /* fine dot grid: texture without noise */
  .banner::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px, rgba(255,255,255,0) 1.3px);
    background-size:30px 30px;background-position:0 0;
  }
  /* hairline that separates the photo zone from the text zone */
  .banner::after{
    content:"";position:absolute;left:440px;top:54px;bottom:54px;width:1px;
    background:linear-gradient(180deg, rgba(255,255,255,0), rgba(125,211,252,.34), rgba(255,255,255,0));
  }
  /* cluster-topology motif: drawn, low contrast, sits under the profile photo */
  .motif{position:absolute;left:0;top:0;width:470px;height:396px;opacity:.45}
  .motif-r{position:absolute;right:0;top:0;width:420px;height:396px;opacity:.22}
  .motif-r line{stroke:rgba(125,211,252,.30);stroke-width:1}
  .motif-r circle{fill:rgba(125,211,252,.40)}
  .motif line{stroke:rgba(125,211,252,.30);stroke-width:1}
  .motif circle{fill:rgba(125,211,252,.42)}
  .motif circle.hub{fill:rgba(56,189,248,.62);r:6}
  .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay}

  .content{
    position:absolute;left:472px;right:300px;top:0;bottom:0;
    display:flex;flex-direction:column;justify-content:center;
  }
  .eyebrow{
    display:flex;align-items:center;gap:14px;
    font-size:19px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
    color:var(--accent-soft);
  }
  .eyebrow .rule{display:block;width:46px;height:3px;background:var(--accent);border-radius:2px}
  h1{
    margin-top:16px;
    font-size:53px;line-height:1.08;font-weight:700;letter-spacing:-.015em;
    color:var(--ink);
  }
  h1 .soft{color:#9BD3F5;font-weight:600}
  .tools{
    margin-top:20px;
    font-size:18px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .metrics{
    margin-top:30px;display:flex;gap:14px;
  }
  .metric{
    padding:14px 22px 16px;border-radius:12px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(125,211,252,.24);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  }
  .metric .num{
    display:block;font-size:42px;line-height:1;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  }
  /* the "+" means "at least": the figures are rounded down to a multiple of ten */
  .metric .plus{color:var(--accent);font-weight:500;font-size:.78em;vertical-align:.12em;margin-right:.04em}
  .metric .lab{
    display:block;margin-top:7px;
    font-size:15px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  }
</style>
</head>
<body>
<div class="banner">

  <svg class="motif" viewBox="0 0 470 396" xmlns="http://www.w3.org/2000/svg">
    <line x1="96" y1="86" x2="49" y2="80"/><line x1="96" y1="86" x2="65" y2="159"/><line x1="214" y1="58" x2="195" y2="113"/><line x1="214" y1="58" x2="232" y2="60"/><line x1="332" y1="104" x2="312" y2="182"/><line x1="332" y1="104" x2="412" y2="120"/><line x1="332" y1="104" x2="328" y2="65"/><line x1="332" y1="104" x2="289" y2="145"/><line x1="64" y1="196" x2="78" y2="223"/><line x1="64" y1="196" x2="65" y2="159"/><line x1="186" y1="168" x2="195" y2="113"/><line x1="186" y1="168" x2="252" y2="250"/><line x1="312" y1="182" x2="372" y2="286"/><line x1="312" y1="182" x2="289" y2="145"/><line x1="312" y1="182" x2="252" y2="250"/><line x1="412" y1="120" x2="328" y2="65"/><line x1="120" y1="296" x2="58" y2="330"/><line x1="120" y1="296" x2="196" y2="344"/><line x1="120" y1="296" x2="67" y2="310"/><line x1="244" y1="258" x2="196" y2="344"/><line x1="244" y1="258" x2="252" y2="250"/><line x1="372" y1="286" x2="252" y2="250"/><line x1="58" y1="330" x2="67" y2="310"/><line x1="195" y1="113" x2="232" y2="60"/><line x1="78" y1="223" x2="65" y2="159"/><line x1="328" y1="65" x2="289" y2="145"/><line x1="49" y1="80" x2="65" y2="159"/>
    <circle cx="96" cy="86" r="3.4"/><circle cx="214" cy="58" r="3.4"/><circle cx="332" cy="104" r="3.4"/><circle cx="64" cy="196" r="3.4"/><circle cx="186" cy="168" r="5.6" class="hub"/><circle cx="312" cy="182" r="3.4"/><circle cx="412" cy="120" r="3.4"/><circle cx="120" cy="296" r="3.4"/><circle cx="244" cy="258" r="3.4"/><circle cx="372" cy="286" r="3.4"/><circle cx="58" cy="330" r="3.4"/><circle cx="196" cy="344" r="4.6"/><circle cx="195" cy="113" r="3.4"/><circle cx="232" cy="60" r="3.4"/><circle cx="67" cy="310" r="3.4"/><circle cx="78" cy="223" r="3.4"/><circle cx="328" cy="65" r="5.6" class="hub"/><circle cx="289" cy="145" r="3.4"/><circle cx="49" cy="80" r="4.6"/><circle cx="252" cy="250" r="3.4"/><circle cx="65" cy="159" r="3.4"/>
  </svg>

  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/></filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>

  <svg class="motif-r" viewBox="1150 0 440 396" xmlns="http://www.w3.org/2000/svg">
    <line x1="1256" y1="84" x2="1392" y2="132"/><line x1="1256" y1="84" x2="1300" y2="232"/><line x1="1392" y1="132" x2="1445" y2="150"/><line x1="1392" y1="132" x2="1470" y2="160"/><line x1="1522" y1="72" x2="1445" y2="150"/><line x1="1522" y1="72" x2="1470" y2="160"/><line x1="1300" y1="232" x2="1284" y2="254"/><line x1="1300" y1="232" x2="1293" y2="298"/><line x1="1452" y1="268" x2="1508" y2="352"/><line x1="1452" y1="268" x2="1443" y2="302"/><line x1="1576" y1="214" x2="1553" y2="254"/><line x1="1576" y1="214" x2="1525" y2="184"/><line x1="1360" y1="330" x2="1443" y2="302"/><line x1="1360" y1="330" x2="1293" y2="298"/><line x1="1508" y1="352" x2="1443" y2="302"/><line x1="1284" y1="254" x2="1293" y2="298"/><line x1="1553" y1="254" x2="1525" y2="184"/><line x1="1525" y1="184" x2="1470" y2="160"/><line x1="1445" y1="150" x2="1470" y2="160"/>
    <circle cx="1256" cy="84" r="3.2"/><circle cx="1392" cy="132" r="4.4"/><circle cx="1522" cy="72" r="3.2"/><circle cx="1300" cy="232" r="3.2"/><circle cx="1452" cy="268" r="3.2"/><circle cx="1576" cy="214" r="3.2"/><circle cx="1360" cy="330" r="3.2"/><circle cx="1508" cy="352" r="4.4"/><circle cx="1284" cy="254" r="3.2"/><circle cx="1553" cy="254" r="3.2"/><circle cx="1525" cy="184" r="3.2"/><circle cx="1445" cy="150" r="3.2"/><circle cx="1443" cy="302" r="3.2"/><circle cx="1293" cy="298" r="3.2"/><circle cx="1470" cy="160" r="3.2"/>
  </svg>

  <div class="content">
    <div class="eyebrow"><span class="rule"></span>DevOps Engineer</div>
    <h1>Scale cloud infrastructure<br><span class="soft">with CI/CD and Kubernetes</span></h1>
    <div class="tools">AWS · Kubernetes · Terraform · Helm · Ansible · Azure DevOps</div>
    <div class="metrics">
      <div class="metric"><span class="num"><span class="plus">+</span>70</span><span class="lab">Microservices deployed</span></div>
      <div class="metric"><span class="num"><span class="plus">+</span>20</span><span class="lab">Pre-production clusters</span></div>
      <div class="metric"><span class="num"><span class="plus">+</span>20</span><span class="lab">CI/CD pipelines</span></div>
    </div>
  </div>

</div>
</body>
</html>
